<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP 廠商付款條件查詢</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fcfcfc; color: #374151; font: 14px "Segoe UI", "Microsoft JhengHei", sans-serif; }
main { width: 95%; margin: 12px auto; }
h1 { font-size: 18px; margin: 0 0 12px; }
form { padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; box-shadow: 0 2px 8px #0001; }
.fields { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(180px, 3fr) auto; gap: 10px; align-items: end; }
label { display: grid; gap: 4px; color: #475569; font-weight: bold; }
input, select, button { min-height: 38px; border-radius: 4px; font: inherit; padding: 6px 10px; }
input, select { width: 100%; border: 1px solid #cbd5e1; background: white; }
button { border: 1px solid #475569; background: #475569; color: white; font-weight: bold; cursor: pointer; padding-inline: 18px; }
button:disabled { opacity: .6; cursor: wait; }
:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
#status { min-height: 1.4em; margin: 12px 0 8px; }
.table { overflow: auto; max-height: 65vh; border: 1px solid #e5e7eb; border-radius: 6px; background: white; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; }
th { position: sticky; top: 0; background: #f3f4f6; white-space: nowrap; }
td:first-child { white-space: nowrap; }
tr:hover td { background: #f8fafc; }
@media (max-width: 580px) { .fields { grid-template-columns: 1fr; } input, select { font-size: 16px; } }
</style>
</head>
<body>
<main>
<h1>SAP 廠商付款條件查詢</h1>
<form id="search">
  <div class="fields">
    <label>廠商統編／自訂編號
      <input id="supplier-id" maxlength="100" placeholder="輸入 8 碼統編或自訂編號">
    </label>
    <label>公司名稱
      <input id="company-name" maxlength="100" placeholder="輸入至少 2 個字元">
    </label>
    <button id="submit" type="submit">查詢</button>
  </div>
</form>
<p id="status" role="status">請輸入廠商編號或公司名稱。</p>
<div class="table" id="table" hidden>
  <table aria-label="廠商查詢結果">
    <thead><tr><th scope="col">廠商編號</th><th scope="col">公司名稱</th><th scope="col">付款條件</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
</div>
</main>
<script>
const TERMS = {
  '0100': '即期-現金', '0200': '即期-支票', '0300': '即期-電匯',
  '0301': '工程-5日/20日電匯', 'K215': '月結15天支票', 'K230': '月結30天支票',
  'K245': '月結45天支票', 'K260': '月結60天支票', 'K290': '月結90天支票',
  'K315': '月結15天電匯款', 'K330': '月結30天電匯款', 'K345': '月結45天電匯款',
  'K360': '月結60天電匯款', 'K390': '月結90天電匯款', 'K3C0': '月結120天電匯款',
  'K3NN': '保留款'
};

function parseCsv(text) {
  const rows = [];
  let row = [];
  let value = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (quoted) {
      if (char === '"' && text[i + 1] === '"') {
        value += '"';
        i++;
      } else if (char === '"') {
        quoted = false;
      } else {
        value += char;
      }
    } else if (char === '"' && !value) {
      quoted = true;
    } else if (char === ',') {
      row.push(value);
      value = '';
    } else if (char === '\n' || char === '\r') {
      rows.push([...row, value]);
      row = [];
      value = '';
      if (char === '\r' && text[i + 1] === '\n') i++;
    } else {
      value += char;
    }
  }
  if (quoted) throw new Error('Incomplete CSV');
  if (row.length || value) rows.push([...row, value]);
  return rows;
}

function normalizeId(value) {
  return /^00\d{8}$/.test(value) ? value.slice(2) : value;
}

function supplierRows(csv) {
  const [headers = [], ...rows] = parseCsv(csv.replace(/^\uFEFF/, ''));
  const [idColumn, nameColumn, termsColumn] = ['SD_SUPPLIER', 'COM_NAME', 'PAY_TERMS']
    .map(column => headers.findIndex(header => header.trim() === column));
  if ([idColumn, nameColumn, termsColumn].includes(-1)) throw new Error('Missing CSV columns');

  return rows.filter(row => row[idColumn]?.trim()).map(row => {
    const id = normalizeId(row[idColumn].trim());
    const name = (row[nameColumn] || '').trim();
    const raw = (row[termsColumn] || '').trim();
    const code = /^\d{1,4}$/.test(raw) ? raw.padStart(4, '0') : raw.toUpperCase();
    const label = TERMS[code || '0301'] || (/^[A-Z0-9]+$/.test(code) ? '未對照（' + raw + '）' : raw);
    return [id, name, label];
  });
}

function matchingSuppliers(rows, id, name) {
  const idKey = normalizeId(id).toLowerCase();
  const nameKey = name.toLowerCase();
  return rows.filter(([supplierId, company]) =>
    (!idKey || supplierId.toLowerCase() === idKey) &&
    (!nameKey || company.toLowerCase().includes(nameKey)));
}

let suppliers;
function loadSuppliers() {
  if (!suppliers) {
    suppliers = fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSixigqeW99mSQdJss48AqEJ4gNMhex9-BcUmtRJ-8njbNANXgytX4IwzHMSnl8JintvYu8GIXmfJyi/pub?output=csv", { cache: 'no-store', credentials: 'omit' })
      .then(response => {
        if (!response.ok) throw new Error('CSV download failed');
        return response.text();
      })
      .then(supplierRows)
      .catch(error => {
        suppliers = undefined;
        throw error;
      });
  }
  return suppliers;
}
loadSuppliers().catch(() => {});

const form = document.querySelector('#search');
const supplierId = document.querySelector('#supplier-id');
const companyName = document.querySelector('#company-name');
const status = document.querySelector('#status');
const table = document.querySelector('#table');
const results = document.querySelector('#results');

let timer;
let revision = 0;
let composing = false;

function clearResults() {
  results.replaceChildren();
  table.hidden = true;
}

async function search() {
  clearTimeout(timer);
  const id = supplierId.value.trim();
  const name = companyName.value.trim();
  const request = ++revision;
  clearResults();
  if ((!id && !name) || (name && name.length < 2)) {
    status.textContent = name ? '公司名稱請輸入至少 2 個字元。' : '請輸入廠商統編、自訂編號或公司名稱。';
    return;
  }

  status.textContent = '查詢中…';
  try {
    const matches = matchingSuppliers(await loadSuppliers(), id, name);
    const data = { rows: matches.slice(0, 50), truncated: matches.length > 50 };
    if (request !== revision) return;
    for (const values of data.rows) {
      const row = results.insertRow();
      for (const value of values) row.insertCell().textContent = value;
    }
    table.hidden = data.rows.length === 0;
    status.textContent = data.truncated ? '顯示前 50 筆，請縮小搜尋範圍。'
      : data.rows.length ? '找到 ' + data.rows.length + ' 筆資料。'
      : '目前的廠商清單中查無符合資料。';
  } catch {
    if (request === revision) status.textContent = '暫時無法查詢，請稍後重試。';
  }
}

function scheduleSearch() {
  clearTimeout(timer);
  revision++;
  clearResults();
  status.textContent = '請輸入廠商統編、自訂編號或公司名稱。';
  if (composing) return;
  const id = supplierId.value.trim();
  const name = companyName.value.trim();
  if (id && !/^(?:\d{8}|00\d{8}|[A-Za-z]\d{7})$/.test(id)) {
    status.textContent = '請完成編號，或按查詢送出。';
    return;
  }
  if ((!id && !name) || (name && name.length < 2)) {
    if (name) status.textContent = '公司名稱請輸入至少 2 個字元。';
    return;
  }
  status.textContent = '準備查詢…';
  timer = setTimeout(search, 350);
}

form.addEventListener('input', scheduleSearch);
form.addEventListener('compositionstart', () => {
  composing = true;
  scheduleSearch();
});
form.addEventListener('compositionend', () => {
  composing = false;
  scheduleSearch();
});
form.addEventListener('submit', event => {
  event.preventDefault();
  if (!composing) search();
});
</script>
</body>
</html>

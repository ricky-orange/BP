<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP 廠商付款條件查詢</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: #eef3f8; color: #172b42; font: 17px/1.55 "Microsoft JhengHei", system-ui, sans-serif; }
main { width: min(1120px, calc(100% - 48px)); margin: 60px auto; }
h1 { margin: 0 0 24px; font-size: clamp(27px, 4vw, 44px); letter-spacing: -.025em; }
form, .supplier-card { background: #fff; border: 1px solid #d8e2ed; border-radius: 20px; box-shadow: 0 10px 32px #1c3d6010; }
form { padding: clamp(20px, 4vw, 36px); }
.fields, .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
label { display: block; margin-bottom: 8px; font-weight: 700; }
.control { position: relative; }
input { width: 100%; min-height: 60px; padding: 12px 56px 12px 16px; border: 1px solid #aabbd0; border-radius: 12px; color: inherit; font: inherit; }
button { font: inherit; cursor: pointer; }
.clear { position: absolute; inset: 8px 8px 8px auto; width: 44px; border: 0; border-radius: 8px; background: #edf2f8; color: #294461; font-size: 25px; }
#submit { margin-top: 20px; min-height: 48px; padding: 8px 28px; border: 0; border-radius: 10px; background: #173d65; color: #fff; font-weight: 700; }
#submit:hover { background: #245785; }
:focus-visible { outline: 3px solid #2879bd; outline-offset: 3px; }
#status { margin: 24px 0 14px; color: #405872; }
.supplier-card { padding: 22px; overflow-wrap: anywhere; }
.supplier-card h2 { margin: 0 0 16px; font-size: 22px; }
.supplier-card p { margin: 6px 0; }
.supplier-card span { color: #405872; margin-right: 12px; }
@media (max-width: 640px) {
  main { width: calc(100% - 28px); margin: 26px auto; }
  .fields, .cards { grid-template-columns: 1fr; }
}

body { color: #211c3d; background: radial-gradient(ellipse at 5% 70%, #dfd2ff, transparent 45%), radial-gradient(ellipse at 93% 10%, #ffd5ef, transparent 45%), #fff1fa; }
h1 { color: #fff; position: relative; overflow: hidden; isolation: isolate; padding: clamp(25px, 5vw, 52px); border-radius: 30px; background: linear-gradient(120deg, #5640c9, #7560e4); box-shadow: 0 18px 42px #6448ba33; }
h1::after { content: ''; position: absolute; z-index: -1; width: 260px; height: 260px; border-radius: 50%; top: -145px; right: -25px; background: #a891ff55; box-shadow: -150px 185px 0 -80px #ffb9ec55; }
form, .supplier-card { border-color: #eee2fb; border-radius: 26px; box-shadow: 0 14px 34px #62349b16; }
input { border-color: #d6c7ec; background: #fcf9ff; }
.clear { background: #f1eafa; color: #6448a0; }
#submit { border-radius: 999px; background: #5134b1; }
#submit:hover { background: #412793; }
:focus-visible { outline-color: #7354d0; }
#status, .supplier-card .field-label { color: #58496e; }
.supplier-card h2 { margin-bottom: 14px; }
.supplier-card p { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.supplier-card .field-label { margin: 0; }
.copy-value { display: inline-flex; align-items: baseline; gap: 8px; max-width: 100%; min-width: 0; padding: 2px 4px; color: inherit; background: transparent; border: 0; border-radius: 6px; font: inherit; font-weight: 700; text-align: left; }
.copy-value:hover { background: #f4edff; }
.copy-value .copy-icon { flex: none; width: 16px; height: 16px; margin: 0; color: #a39daf; align-self: center; }
.copy-value[data-copied] .copy-icon { color: #6544bf; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main>
<h1>SAP 廠商付款條件查詢</h1>
<form id="search">
  <div class="fields">
    <div>
      <label for="supplier-id">廠商統編／自訂編號</label>
      <div class="control">
        <input id="supplier-id" maxlength="100" placeholder="輸入 8 碼統編或自訂編號">
        <button type="button" class="clear" data-input="supplier-id" aria-label="清空廠商統編或自訂編號" hidden>×</button>
      </div>
    </div>
    <div>
      <label for="company-name">公司名稱</label>
      <div class="control">
        <input id="company-name" maxlength="100" placeholder="輸入至少 2 個字元">
        <button type="button" class="clear" data-input="company-name" aria-label="清空公司名稱" hidden>×</button>
      </div>
    </div>
  </div>
  <button id="submit" type="submit">查詢</button>
</form>
<p id="status" role="status">請輸入廠商統編、自訂編號或公司名稱。</p>
<section class="cards" id="results" aria-label="廠商查詢結果"></section>
<p id="copy-status" class="sr-only" role="status"></p>
</main>
<script>
const TERMS = {
  '0100': '即期-現金', '0200': '即期-支票', '0300': '即期-電匯',
  '0301': '工程-5日/20日電匯', 'K215': '月結15天支票', 'K230': '月結30天支票',
  'K245': '月結45天支票', 'K260': '月結60天支票', 'K290': '月結90天支票',
  'K315': '月結15天電匯款', 'K330': '月結30天電匯款', 'K345': '月結45天電匯款',
  'K360': '月結60天電匯款', 'K390': '月結90天電匯款', 'K3C0': '月結120天電匯款',
  'K3NN': '保留款'
};

function parseCsv(text) {
  const rows = [];
  let row = [];
  let value = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (quoted) {
      if (char === '"' && text[i + 1] === '"') {
        value += '"';
        i++;
      } else if (char === '"') {
        quoted = false;
      } else {
        value += char;
      }
    } else if (char === '"' && !value) {
      quoted = true;
    } else if (char === ',') {
      row.push(value);
      value = '';
    } else if (char === '\n' || char === '\r') {
      rows.push([...row, value]);
      row = [];
      value = '';
      if (char === '\r' && text[i + 1] === '\n') i++;
    } else {
      value += char;
    }
  }
  if (quoted) throw new Error('Incomplete CSV');
  if (row.length || value) rows.push([...row, value]);
  return rows;
}

function normalizeId(value) {
  return /^00\d{8}$/.test(value) ? value.slice(2) : value;
}

function supplierRows(csv) {
  const [headers = [], ...rows] = parseCsv(csv.replace(/^\uFEFF/, ''));
  const [idColumn, nameColumn, termsColumn] = ['SD_SUPPLIER', 'COM_NAME', 'PAY_TERMS']
    .map(column => headers.findIndex(header => header.trim() === column));
  if ([idColumn, nameColumn, termsColumn].includes(-1)) throw new Error('Missing CSV columns');

  return rows.filter(row => row[idColumn]?.trim()).map(row => {
    const id = normalizeId(row[idColumn].trim());
    const name = (row[nameColumn] || '').trim();
    const raw = (row[termsColumn] || '').trim();
    const code = /^\d{1,4}$/.test(raw) ? raw.padStart(4, '0') : raw.toUpperCase();
    const label = TERMS[code || '0301'] || (/^[A-Z0-9]+$/.test(code) ? '未對照（' + raw + '）' : raw);
    return [id, name, label];
  });
}

function matchingSuppliers(rows, id, name) {
  const idKey = normalizeId(id).toLowerCase();
  const nameKey = name.toLowerCase();
  return rows.filter(([supplierId, company]) =>
    (!idKey || supplierId.toLowerCase() === idKey) &&
    (!nameKey || company.toLowerCase().includes(nameKey)));
}

let suppliers;
function loadSuppliers() {
  if (!suppliers) {
    suppliers = fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSixigqeW99mSQdJss48AqEJ4gNMhex9-BcUmtRJ-8njbNANXgytX4IwzHMSnl8JintvYu8GIXmfJyi/pub?output=csv", { cache: 'no-store', credentials: 'omit' })
      .then(response => {
        if (!response.ok) throw new Error('CSV download failed');
        return response.text();
      })
      .then(supplierRows)
      .catch(error => {
        suppliers = undefined;
        throw error;
      });
  }
  return suppliers;
}
loadSuppliers().catch(() => {});

const form = document.querySelector('#search');
const supplierId = document.querySelector('#supplier-id');
const companyName = document.querySelector('#company-name');
const status = document.querySelector('#status');
const results = document.querySelector('#results');

let timer;
let revision = 0;
let composing = false;

function copyValue(label, value) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'copy-value';
  button.setAttribute('aria-label', '複製' + label + '：' + value);
  button.append(document.createTextNode(value));
  button.insertAdjacentHTML('beforeend', '<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>');
  const feedback = document.querySelector('#copy-status');
  const icon = button.querySelector('svg');
  const original = icon.innerHTML;
  let reset;
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(value);
      clearTimeout(reset);
      feedback.textContent = '已複製' + label;
      button.dataset.copied = '';
      icon.innerHTML = '<path d="m5 12 4 4L19 6"/>';
      reset = setTimeout(() => {
        delete button.dataset.copied;
        icon.innerHTML = original;
      }, 1200);
    } catch {
      feedback.textContent = '無法複製' + label;
      button.title = feedback.textContent;
    }
  });
  return button;
}

function clearResults() {
  results.replaceChildren();
}

async function search() {
  clearTimeout(timer);
  const id = supplierId.value.trim();
  const name = companyName.value.trim();
  const request = ++revision;
  clearResults();
  if ((!id && !name) || (name && name.length < 2)) {
    status.textContent = name ? '公司名稱請輸入至少 2 個字元。' : '請輸入廠商統編、自訂編號或公司名稱。';
    return;
  }

  status.textContent = '查詢中…';
  try {
    const matches = matchingSuppliers(await loadSuppliers(), id, name);
    const data = { rows: matches.slice(0, 50), truncated: matches.length > 50 };
    if (request !== revision) return;
    for (const [id, name, terms] of data.rows) {
      const card = document.createElement('article');
      card.className = 'supplier-card';
      const title = document.createElement('h2');
      if (name) title.append(copyValue('廠商名稱', name));
      else title.textContent = '未填公司名稱';
      card.append(title);
      for (const [label, value] of [['廠商編號', id], ['付款條件', terms]]) {
        const line = document.createElement('p');
        const caption = document.createElement('span');
        caption.textContent = label;
        caption.className = 'field-label';
        line.append(caption, copyValue(label, value));
        card.append(line);
      }
      results.append(card);
    }
    status.textContent = data.truncated ? '顯示前 50 筆，請縮小搜尋範圍。'
      : data.rows.length ? '找到 ' + data.rows.length + ' 筆資料。'
      : '目前的廠商清單中查無符合資料。';
  } catch {
    if (request === revision) status.textContent = '暫時無法查詢，請稍後重試。';
  }
}

function scheduleSearch() {
  clearTimeout(timer);
  revision++;
  clearResults();
  status.textContent = '請輸入廠商統編、自訂編號或公司名稱。';
  if (composing) return;
  const id = supplierId.value.trim();
  const name = companyName.value.trim();
  if (id && !/^(?:\d{8}|00\d{8}|[A-Za-z]\d{7})$/.test(id)) {
    status.textContent = '請完成編號，或按查詢送出。';
    return;
  }
  if ((!id && !name) || (name && name.length < 2)) {
    if (name) status.textContent = '公司名稱請輸入至少 2 個字元。';
    return;
  }
  status.textContent = '準備查詢…';
  timer = setTimeout(search, 350);
}

for (const button of form.querySelectorAll('.clear')) {
  const input = document.getElementById(button.dataset.input);
  const other = input === supplierId ? companyName : supplierId;
  const otherButton = form.querySelector('[data-input="' + other.id + '"]');

  function activateInput() {
    if (!other.value) return;
    other.value = '';
    otherButton.hidden = true;
    scheduleSearch();
  }

  input.addEventListener('focus', activateInput);
  input.addEventListener('input', () => {
    activateInput();
    button.hidden = !input.value;
    scheduleSearch();
  });
  button.addEventListener('click', () => {
    input.value = '';
    input.focus();
    button.hidden = true;
    scheduleSearch();
  });
}
form.addEventListener('compositionstart', () => {
  composing = true;
  scheduleSearch();
});
form.addEventListener('compositionend', () => {
  composing = false;
  scheduleSearch();
});
form.addEventListener('submit', event => {
  event.preventDefault();
  if (!composing) search();
});
</script>
</body>
</html>
